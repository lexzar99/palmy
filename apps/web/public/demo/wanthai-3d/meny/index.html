<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Beställ från Wanthai</title>
  <meta name="theme-color" content="#fbf6ee" />
  <link rel="manifest" href="/demo/wanthai-3d/manifest.webmanifest" />
  <link rel="icon" href="/demo/wanthai-3d/img/icon-192.png" />
  <link rel="apple-touch-icon" href="/demo/wanthai-3d/img/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Wanthai" />
  <style>:root{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light}*{box-sizing:border-box}html,body{background:#fbf6ee;width:100%;height:100%;margin:0;overflow:hidden}body{color:#18130f;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif}[data-viaeats-menu]{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:#fbf6ee;position:fixed;inset:0}.menu-loading{color:#6c5f55;place-items:center;min-height:220px;margin:0;font-size:14px;font-weight:600;display:grid}.menu-error{text-align:center;color:#8f241a;max-width:520px;margin:24px auto;padding:20px;line-height:1.6}.menu-error a{color:#1d7f9b;font-weight:700}</style>
</head>
<body>
  <main data-viaeats-menu="wanthai-foodtruck" data-viaeats-fullscreen="1" data-viaeats-back="/demo/wanthai-3d" aria-busy="true">
    <p class="menu-loading">Laddar Wanthais meny</p>
  </main>
  <script>
    function showMenuFallback() {
      var host = document.querySelector('[data-viaeats-menu]');
      if (!host || host.querySelector('iframe')) return;
      host.removeAttribute('aria-busy');
      host.innerHTML = '<p class="menu-error">Menyn kunde inte laddas just nu. <a href="https://www.viaeats.se/restaurants/wanthai-foodtruck">Öppna Wanthais beställning på viaeats</a>.<br><a href="/demo/wanthai-3d">Tillbaka till Wanthai</a></p>';
    }
    window.addEventListener('DOMContentLoaded', function () { window.setTimeout(showMenuFallback, 8000); });
  </script>
  <script src="https://www.viaeats.se/embed.js?v=20261027" defer onerror="showMenuFallback()"></script>
</body>
</html>
