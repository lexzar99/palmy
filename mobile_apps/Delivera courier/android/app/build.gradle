plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseSigningFields = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingReleaseSigningFields = releaseSigningFields.findAll {
    !keystoreProperties[it]?.toString()?.trim()
}
def releaseStoreFile = keystoreProperties['storeFile']
    ? rootProject.file(keystoreProperties['storeFile'])
    : null
def hasReleaseSigning = missingReleaseSigningFields.isEmpty() && releaseStoreFile?.isFile()
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
if (releaseBuildRequested && !hasReleaseSigning) {
    def detail = missingReleaseSigningFields.isEmpty()
        ? "keystore file not found: ${releaseStoreFile}"
        : "missing properties: ${missingReleaseSigningFields.join(', ')}"
    throw new GradleException(
        "Release signing is not configured (${detail}). Add android/key.properties " +
        "and the referenced release keystore. Debug builds do not require release signing."
    )
}

android {
    namespace = "se.delivera.delivera_courier"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "se.delivera.courier"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = releaseStoreFile
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
