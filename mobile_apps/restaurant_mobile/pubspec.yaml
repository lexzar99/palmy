name: restaurant_mobile
description: A professional order taking app for MatGo partners.
version: 1.34.7+47

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  intl: ^0.20.2
  flutter_spinkit: ^5.2.1
  animate_do: ^3.3.4
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.1.0
  cached_network_image: ^3.4.1
  printing: ^5.13.2
  pdf: ^3.11.1
  esc_pos_utils_plus: ^2.0.3
  print_bluetooth_thermal: ^1.1.9
  network_info_plus: ^5.0.3
  ping_discover_network_forked: ^0.0.1
  package_info_plus: ^8.0.0
  wakelock_plus: ^1.2.10
  flutter_foreground_task: ^8.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0E1628"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icon/
