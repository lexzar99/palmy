allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// Shim: imin_printer-pluginet refererar flutter.compileSdkVersion/minSdkVersion
// i sin EGEN android{}-block (och har en egen buildscript-block) → Flutter-
// extensionen injiceras inte i den modul-kontexten, vilket ger
// "unknown property 'flutter'". Ge just den modulen ett flutter-objekt med
// SDK-versionerna innan den utvärderas så konfigurationen inte kraschar.
subprojects { sp ->
    if (sp.name == 'imin_printer') {
        sp.ext.flutter = [
            compileSdkVersion: 35,
            minSdkVersion    : 21,
            targetSdkVersion : 35,
        ]
    }
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            android {
                compileSdkVersion 35
                // lintVitalAnalyzeRelease kraschar i vissa plugin-moduler
                // (UnsatisfiedLinkError i AWT/headless) och blockerar release-APK:n.
                // Lint behövs inte för att bygga → stäng av den för alla moduler.
                lintOptions {
                    checkReleaseBuilds false
                    abortOnError false
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
