plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase Cloud Messaging – kräver att android/app/google-services.json finns.
    // Plugin är säker att lämna även utan filen vid debug-build (varnar bara).
    id "com.google.gms.google-services"
}

// Läs release-signing från ../key.properties (committas EJ).
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseSigningFields = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingReleaseSigningFields = releaseSigningFields.findAll {
    !keystoreProperties[it]?.toString()?.trim()
}
def releaseStoreFile = keystoreProperties['storeFile']
    ? rootProject.file(keystoreProperties['storeFile'])
    : null
def hasReleaseSigning = missingReleaseSigningFields.isEmpty() && releaseStoreFile?.isFile()
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
if (releaseBuildRequested && !hasReleaseSigning) {
    def detail = missingReleaseSigningFields.isEmpty()
        ? "keystore file not found: ${releaseStoreFile}"
        : "missing properties: ${missingReleaseSigningFields.join(', ')}"
    throw new GradleException(
        "Release signing is not configured (${detail}). Add android/key.properties " +
        "and the referenced release keystore. Debug builds do not require release signing."
    )
}

android {
    namespace = "com.matgo.restaurant"
    compileSdk = 35
    // Firebase + flera native-paket kräver minst 27.x
    ndkVersion = "27.0.12077973"

    // Lint kraschar i :android_id:lintVitalAnalyzeRelease (UnsatisfiedLinkError i
    // AWT/headless-miljö) och blockerar release-APK:n. Vi behöver inte lint för
    // att bygga en installerbar APK → stäng av den för release-bygget.
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.matgo.restaurant"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Sunmi V2 kör Android 7.x (API 24/25) och 32-bitars ARM.
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName

    }

    flavorDimensions += "terminal"
    productFlavors {
        // Alla Android-terminaler: inbyggd skrivare samt externa Bluetooth-
        // och Wi-Fi-skrivare.
        universal {
            dimension "terminal"
        }
        // Universal-terminaler med ENDAST inbyggd skrivare. Eget manifest som
        // tar bort Bluetooth-behörigheterna. Bygg med
        //   --flavor universalBuiltin --dart-define=BUILTIN_ONLY=true
        universalBuiltin {
            dimension "terminal"
        }
        // Sunmi V2 kör 32-bitars ARM och Android 7 (API 24/25). Variationen
        // har dessutom ett eget manifest utan Bluetooth-behörigheter.
        sunmiV2 {
            dimension "terminal"
            minSdk = 24
            ndk {
                abiFilters "armeabi-v7a"
            }
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = releaseStoreFile
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
