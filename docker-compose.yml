services:
  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=palmyra
      - POSTGRES_PASSWORD=palmyra
      - POSTGRES_DB=palmyra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
