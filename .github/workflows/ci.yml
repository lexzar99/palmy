name: CI — launch gate

# Körs på varje push till main + alla PR:s. Produktionsmiljöerna ska kräva
# denna workflow som grön statuscheck före promotion; en parallell auto-deploy
# direkt från main är inte en säker launchprocess.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-typecheck:
    name: API — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL migration-test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Build API
        run: pnpm --filter @viaeats/api build

      - name: API launch contracts
        run: |
          pnpm --filter @viaeats/api test:contracts
          pnpm --filter @viaeats/api test:order-status
          pnpm --filter @viaeats/api test:referrals
          pnpm --filter @viaeats/api test:refunds
          pnpm --filter @viaeats/api test:finance-payouts
          pnpm --filter @viaeats/api test:hermes
          pnpm --filter @viaeats/api test:customer-notifier
          pnpm --filter @viaeats/api test:notification-access
          pnpm --filter @viaeats/api test:order-access
          pnpm --filter @viaeats/api test:order-extra-pricing
          pnpm --filter @viaeats/api test:mollie-lines
          pnpm --filter @viaeats/api test:readiness
          pnpm --filter @viaeats/api test:admin-auth-p0
          pnpm --filter @viaeats/api test:database-readiness
          pnpm --filter @viaeats/api test:prelaunch-access
          pnpm --filter @viaeats/api test:request-security
          pnpm --filter @viaeats/api test:notification-outbox
          pnpm --filter @viaeats/api test:notification-reconciler

      - name: Database launch contracts
        run: |
          pnpm --filter @viaeats/api test:schema-baseline
          pnpm --filter @viaeats/api test:migration-isolation
          pnpm --filter @viaeats/api test:migration-payment-tax
          pnpm --filter @viaeats/api test:migration-notifications
          pnpm --filter @viaeats/api test:migration-customer-auth
          pnpm --filter @viaeats/api test:migration-payout-recovery
          pnpm --filter @viaeats/api test:migration-refund-ledger

  web-typecheck:
    name: Web — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web contracts
        run: pnpm --filter web test:contracts

      - name: Build web
        run: pnpm --filter web build

  admin-typecheck:
    name: Admin — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint admin
        run: pnpm --filter admin lint

      - name: Build admin
        run: pnpm --filter admin build
