name: Build React Matgo APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_apps/REACT-MATGO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile_apps/REACT-MATGO/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Build APK on EAS
        id: build
        run: |
          OUTPUT=$(eas build --platform android --profile preview --non-interactive --wait 2>&1)
          echo "$OUTPUT"
          BUILD_ID=$(echo "$OUTPUT" | grep -oP 'builds/\K[a-f0-9-]+' | head -1)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get build details and download APK
        run: |
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          echo "Downloading build: $BUILD_ID"
          
          # Get build details from EAS API
          BUILD_DETAILS=$(curl -s -H "Authorization: Bearer $EXPO_TOKEN" \
            "https://expo.dev/api/v2/builds/$BUILD_ID")
          
          echo "Build details: $BUILD_DETAILS"
          
          # Extract download URL
          DOWNLOAD_URL=$(echo "$BUILD_DETAILS" | grep -oP '"artifacts":\{"buildUrl":"\K[^"]+')
          echo "Download URL: $DOWNLOAD_URL"
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Could not find download URL in build details"
            echo "Full response: $BUILD_DETAILS"
            exit 1
          fi
          
          # Download the APK
          curl -L -o react-matgo.apk "$DOWNLOAD_URL"
          ls -la *.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-matgo-apk
          path: mobile_apps/REACT-MATGO/*.apk
