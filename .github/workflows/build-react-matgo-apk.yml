name: Build React Matgo APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_apps/REACT-MATGO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile_apps/REACT-MATGO/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-matgo-apk
          path: mobile_apps/REACT-MATGO/*.apk
