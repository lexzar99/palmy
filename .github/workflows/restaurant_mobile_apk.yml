name: Build Restaurant Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/restaurant_mobile/**"
      - ".github/workflows/restaurant_mobile_apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/restaurant_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant_mobile-apk
          path: apps/restaurant_mobile/build/app/outputs/flutter-apk/app-release.apk
