# Osteria Cucco — meny för massimport (Admin → Meny → Massimport, eller POST /api/admin/menu/bulk-import).
# Källa: Cuccos Eatsmart-meny, avläst 2026-09-21 (23 rätter, priser i KRONOR).
# Tillval per rätt följer Eatsmart exakt: pizzor = Glutenfri botten + Något extra på pizzan + Dryck,
# pasta = Dryck, antipasti och drycker = inga tillval.
# OBS: dryckesgruppen "Lägg till dryck" görs om till bildrutor (BOX_IMAGE) efter importen — importformatet bär inte bilder.
extraGroups:
  - name: Glutenfri botten
    type: checkbox
    required: false
    max: 1
    options:
      - { name: Glutenfri botten, price: 25 }
  - name: Något extra på pizzan
    type: checkbox
    required: false
    max: 5
    options:
      - { name: "Prosciutto di Parma DOP (lufttorkad skinka)", price: 40 }
      - { name: "Mortadella (innehåller pistagenötter)", price: 35 }
      - { name: "Svamp mix (champinjoner & karljohanssvamp)", price: 30 }
      - { name: Fänkålssalami, price: 35 }
      - { name: Gorgonzola, price: 30 }
  - name: Lägg till dryck
    type: checkbox
    required: false
    max: 5
    options:
      - { name: "San Pellegrino 50 cl", price: 30 }
      - { name: "Coca-Cola 33 cl", price: 25 }
      - { name: "Coca-Cola Zero 33 cl", price: 25 }
      - { name: "Fanta 33 cl", price: 25 }
      - { name: "Bonaqua Citron 50 cl", price: 25 }

