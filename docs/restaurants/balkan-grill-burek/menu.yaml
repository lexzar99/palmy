# Balkan Grill & Burek, Burlöv Center: meny för massimport (Admin → Meny → Massimport, eller POST /api/admin/menu/bulk-import).
# Källa: restaurangens egen meny (~/Website/balkan-site/assets/references/meny.jpg), avläst 2026-10-27. Priser i KRONOR, exakt som på menyn.
# Inget är tillagt som inte står på menyn. Där menyn saknar beskrivning är fältet tomt.
# Tillval: få tillval blir bildrutor (BOX_IMAGE, se images.json → boxImageGroups). Långa listor (dryck) visas som lista.
extraGroups:
  - name: Tillbehör
    type: checkbox
    required: false
    max: 10
    options:
      - { name: Ajvar, price: 19 }
      - { name: Kajmak, price: 29 }
      - { name: Tzatziki, price: 19 }
      - { name: Lepinja, price: 19 }
      - { name: Pommes frites liten, price: 39 }
      - { name: Pommes frites stor, price: 59 }
  # Menyn: "Pommes +20 kr" till hamburgarna.
  - name: Pommes till burgaren
    type: checkbox
    required: false
    max: 1
    options:
      - { name: Pommes frites, price: 20 }
  # Shopska 39/59 och Grekisk 49/69: liten och stor, skillnaden är 20 kr på båda.
  - name: Storlek
    type: radio
    required: true
    options:
      - { name: Liten, price: 0 }
      - { name: Stor, price: 20 }
  - name: Storlek pommes
    type: radio
    required: true
    options:
      - { name: Liten, price: 0 }
      - { name: Stor, price: 20 }
  - name: Lägg till dryck
    type: checkbox
    required: false
    max: 10
    options:
      - { name: Ayran, price: 19 }
      - { name: Läsk, price: 25 }
      - { name: Cockta, price: 25 }
      - { name: "Lättöl 2,2 %", price: 29 }
      - { name: "Lättöl 2,1 %", price: 29 }
      - { name: "PEJA 0,0 %", price: 29 }

