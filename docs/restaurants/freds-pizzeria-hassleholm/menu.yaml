# Freds Pizzeria (Fared Restaurang), Vattugatan 12, Hässleholm: meny för massimport.
# Källa: foodora (foodora.se/restaurant/rd9y), avläst 2026-10-27. Ordinarie priser, inte foodoras 30 %-kampanj.
# Tillvalen följer Palmyras uppsättning: få val blir bildrutor (images.json), extra pålägg är en lista.
# ANTAGET: Familj +110 kr och priserna för extra pålägg (Palmyras), eftersom foodora inte visar tillval när restaurangen är stängd.
extraGroups:
  - name: "Storlek"
    type: radio
    required: true
    options:
      - { name: "Normal", price: 0 }
      - { name: "Familj", price: 110 }
  - name: "Välj sås (ingår)"
    type: radio
    required: true
    options:
      - { name: "Mild sås", price: 0 }
      - { name: "Stark sås", price: 0 }
      - { name: "Blandad sås", price: 0 }
      - { name: "Vitlökssås", price: 0 }
      - { name: "Bearnaisesås", price: 0 }
      - { name: "Ingen sås", price: 0 }
  - name: "Sås i burk"
    type: checkbox
    required: false
    max: 7
    options:
      - { name: "Bearnaisesås i burk", price: 15 }
      - { name: "Currysås i burk", price: 15 }
      - { name: "Mild kebabsås i burk", price: 15 }
      - { name: "Stark kebabsås i burk", price: 15 }
      - { name: "Blandad kebabsås i burk", price: 20 }
      - { name: "Tacosås i burk", price: 20 }
      - { name: "Vitlökssås i burk", price: 15 }
  - name: "Lägg till tillbehör"
    type: checkbox
    required: false
    max: 10
    options:
      - { name: "Pommes frites mellan", price: 40 }
      - { name: "Pommes frites stor", price: 50 }
      - { name: "Vitlöksbröd", price: 50 }
      - { name: "Lökringar 4 st", price: 50 }
      - { name: "Mozzarellasticks 5 st", price: 50 }
      - { name: "Chili Cheese 5 st", price: 50 }
      - { name: "Extra pizzasallad 20 cl", price: 10 }
  - name: "Lägg till dryck"
    type: checkbox
    required: false
    max: 10
    options:
      - { name: "Coca-Cola 33 cl", price: 20 }
      - { name: "Coca-Cola Zero 33 cl", price: 20 }
      - { name: "Fanta Orange 33 cl", price: 20 }
      - { name: "Sprite 33 cl", price: 20 }
      - { name: "Coca-Cola 50 cl", price: 30 }
      - { name: "Coca-Cola Zero 50 cl", price: 30 }
      - { name: "Fanta Orange 50 cl", price: 30 }
      - { name: "Coca-Cola 2 liter", price: 50 }
      - { name: "Fanta Orange 2 liter", price: 50 }
  - name: "Extra pålägg"
    type: checkbox
    required: false
    max: 10
    options:
      - { name: "Ananas", price: 15 }
      - { name: "Bacon", price: 15 }
      - { name: "Banan", price: 15 }
      - { name: "Champinjoner", price: 15 }
      - { name: "Fetaost", price: 15 }
      - { name: "Färska tomater", price: 15 }
      - { name: "Gorgonzolaost", price: 15 }
      - { name: "Jalapeño", price: 15 }
      - { name: "Kebabkött", price: 25 }
      - { name: "Kronärtskocka", price: 15 }
      - { name: "Kyckling", price: 25 }
      - { name: "Köttfärs", price: 15 }
      - { name: "Lök", price: 15 }
      - { name: "Musslor", price: 15 }
      - { name: "Oliver", price: 15 }
      - { name: "Ost", price: 15 }
      - { name: "Oxfilé", price: 25 }
      - { name: "Paprika", price: 15 }
      - { name: "Räkor", price: 25 }
      - { name: "Salami", price: 15 }
