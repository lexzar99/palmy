# Meny för massimport (Admin → Meny → Massimport, eller POST /api/admin/menu/bulk-import). Priser i kronor.
extraGroups:
  - name: "Välj sås (ingår)"
    type: radio
    required: true
    options:
      - { name: "Vitlökssås", price: 0 }
      - { name: "Mild sås", price: 0 }
      - { name: "Stark sås", price: 0 }
      - { name: "Ingen sås", price: 0 }
  - name: "Gör det till en meny"
    type: checkbox
    required: false
    max: 1
    options:
      - { name: "Pommes och dricka", price: 50 }
  - name: "Extra"
    type: checkbox
    required: false
    max: 10
    options:
      - { name: "Extra kebab", price: 20 }
      - { name: "Extra kyckling", price: 20 }
      - { name: "Extra falafel 1 st", price: 8 }
      - { name: "Extra halloumi 1 st", price: 10 }
  - name: "Lägg till dryck"
    type: checkbox
    required: false
    max: 10
    options:
      - { name: "Läsk burk", price: 20 }
      - { name: "Läsk flaska", price: 29 }
      - { name: "Red Bull", price: 25 }
      - { name: "Ayran", price: 20 }
  - name: "Storlek"
    type: radio
    required: true
    options:
      - { name: "Liten", price: 0 }
      - { name: "Stor", price: 15 }
  - name: "Välj lunchrätt"
    type: radio
    required: true
    options:
      - { name: "Ćevapi", price: 0 }
      - { name: "Pljeskavica", price: 0 }
      - { name: "Turkisk kebab", price: 0 }
      - { name: "Falafel", price: 0 }
      - { name: "Burgare", price: 0 }

