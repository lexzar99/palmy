# Wanthai Foodtruck – meny för massimport (Admin → Meny → Massimport, eller POST /api/admin/menu/bulk-import).
# Källa: Wanthais WEIQ-meny (weiq.app/Wanthai/meny), avläst 2026-10-21. Priser i KRONOR, exakt som hos WEIQ.
# Tillval per rätt följer WEIQ: protein, ris eller nudlar och hetta där WEIQ har dem.
# WEIQ:s flik "Allergier" (Nötallergi, Glutenallergi, 0 kr) blir gruppen "Allergi" på alla varmrätter.
# Efter importen görs "Lägg till tillbehör", "Lägg till dryck" och "Dipp" om till bildrutor (BOX_IMAGE)
# med groups-box-image.json – importformatet bär inte bilder.
extraGroups:
  - name: Välj protein
    type: radio
    required: true
    options:
      - { name: Kyckling, price: 0 }
      - { name: Fläskkött, price: 0 }
      - { name: Biff, price: 13 }
      - { name: Räkor, price: 13 }
      - { name: Vegetariskt, price: 0 }
  - name: Ris eller nudlar
    type: radio
    required: true
    options:
      - { name: Jasminris, price: 0 }
      - { name: Äggnudlar, price: 0 }
  - name: Hetta
    type: radio
    required: true
    options:
      - { name: "Mai pet – inte stark", price: 0 }
      - { name: "Pet – medelstark", price: 0 }
      - { name: "Pet maak – mycket stark", price: 0 }
  # Currys, laab och pad ka prao lagas alltid med chili – WEIQ erbjuder inte mild variant på dem.
  - name: Hetta (lagas alltid med chili)
    type: radio
    required: true
    options:
      - { name: "Pet – medelstark", price: 0 }
      - { name: "Pet maak – mycket stark", price: 0 }
  - name: Vegetariskt alternativ
    type: checkbox
    required: false
    max: 1
    options:
      - { name: "Vegofärs i stället för fläskfärs", price: 0 }
  - name: Allergi
    type: checkbox
    required: false
    max: 2
    options:
      - { name: "Nötallergi – tål inte nötter", price: 0 }
      - { name: "Glutenallergi – tål inte gluten", price: 0 }
  - name: Lägg till tillbehör
    type: checkbox
    required: false
    max: 10
    options:
      - { name: Vårrullar 3 st, price: 49 }
      - { name: Crispy chicken, price: 52 }
      - { name: Kycklingnuggets 6 st, price: 39 }
      - { name: Räkchips, price: 23 }
      - { name: Extra jasminris, price: 16 }
      - { name: Extra äggnudlar, price: 16 }
      - { name: Extra räka, price: 6 }
      - { name: Jordnötssås, price: 13 }
  - name: Dipp
    type: checkbox
    required: false
    max: 6
    options:
      - { name: Sweet chili, price: 5 }
      - { name: Vitlöksdipp, price: 5 }
      - { name: Mangoraja, price: 5 }
      - { name: Jordnötssås, price: 13 }
  - name: Lägg till dryck
    type: checkbox
    required: false
    max: 10
    options:
      - { name: Coca-Cola 33 cl, price: 18 }
      - { name: Coca-Cola Zero 33 cl, price: 18 }
      - { name: Fanta 33 cl, price: 18 }
      - { name: Fanta Exotic 33 cl, price: 18 }
      - { name: Fanta Exotic Zero 33 cl, price: 18 }
      - { name: Pepsi Max 33 cl, price: 18 }
      - { name: Pepsi Max Lime 33 cl, price: 18 }
      - { name: Ramlösa Naturell 33 cl, price: 18 }
      - { name: Ramlösa Citrus 33 cl, price: 18 }
      - { name: Ramlösa Granatäpple 33 cl, price: 18 }
      - { name: Ramlösa Grönt äpple 33 cl, price: 18 }
      - { name: Ramlösa Körsbär 33 cl, price: 18 }
      - { name: Ramlösa Mango Grapefrukt 33 cl, price: 18 }
      - { name: Krating Daeng, price: 23 }
      - { name: Lipovitan-D, price: 23 }
      - { name: Red Bull 25 cl, price: 25 }
      - { name: Red Bull Peach Edition, price: 25 }
      - { name: Red Bull Summer Edition, price: 25 }
      - { name: Mer Apelsin 20 cl, price: 14 }
      - { name: Mer Jordgubb 20 cl, price: 14 }

