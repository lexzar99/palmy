<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Beställ från Palmyra Pizzeria</title>
  <link rel="canonical" href="https://www.palmyrapizzeria.se/meny.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500..800&amp;display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fbfbfc; }
    body { color: #211709; font-family: "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif; }
    /* Ingen egen ram: beställningen äger hela skärmen på mobil och dator.
       Tillbaka-knappen och "Powered by viaeats" ligger i embeddens navbar.
       Safe-area-paddingen håller navbaren fri från notch/hemindikator när
       sidan körs som installerad app. */
    [data-viaeats-menu] {
      position: fixed; inset: 0;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      background: #fbfbfc;
    }
    .menu-loading { display: grid; min-height: 220px; place-items: center; margin: 0; color: #776a52; font-size: 14px; font-weight: 700; }
    .menu-error { margin: 24px auto; max-width: 520px; padding: 20px; text-align: center; color: #8f241a; }
    .menu-error a { color: #c22016; font-weight: 800; }
  </style>
</head>
<body>
  <main data-viaeats-menu="palmyra-pizzeria-lund" data-viaeats-fullscreen="1" data-viaeats-back="index.html" aria-busy="true">
    <p class="menu-loading">Laddar Palmyras meny…</p>
  </main>
  <script>
    function showMenuFallback() {
      var host = document.querySelector('[data-viaeats-menu]');
      if (!host || host.querySelector('iframe')) return;
      host.removeAttribute('aria-busy');
      host.innerHTML = '<p class="menu-error">Menyn kunde inte laddas just nu. <a href="https://www.viaeats.se/embed/palmyra-pizzeria-lund">Öppna Palmyras beställning på viaeats</a> eller ring 046-12 06 12.<br><a href="index.html">← Tillbaka till Palmyra</a></p>';
    }
    window.addEventListener('DOMContentLoaded', function () {
      window.setTimeout(showMenuFallback, 8000);
    });
  </script>
  <script src="https://www.viaeats.se/embed.js?v=20260923" defer onerror="showMenuFallback()"></script>
</body>
</html>
