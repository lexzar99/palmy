<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Beställ från Palmyra Pizzeria</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fbf5e8; }
    body { color: #211709; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .menu-page { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .menu-heading { flex: 0 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px 14px; border-bottom: 1.5px solid #211709; background: #fbf5e8; }
    .menu-heading-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .menu-heading strong { display: block; font: 800 21px/1.05 Georgia, serif; }
    .menu-heading span { display: block; margin-top: 4px; color: rgba(33,23,9,.62); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .menu-home-link { display: inline-flex; align-items: center; gap: 5px; min-height: 38px; padding: 0 12px; border: 1px solid rgba(33,23,9,.28); border-radius: 999px; color: #211709; text-decoration: none; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .menu-home-link:active { transform: scale(.98); }
    [data-viaeats-menu] { width: 100%; flex: 1 1 auto; min-height: 0; }
    @media (min-width: 768px) {
      .menu-heading { padding-left: clamp(28px, 5vw, 80px); padding-right: clamp(28px, 5vw, 80px); }
      [data-viaeats-menu] { max-width: 1120px; margin: 0 auto; padding: 0 clamp(28px, 5vw, 80px); }
    }
  </style>
</head>
<body>
  <div class="menu-page">
    <header class="menu-heading">
      <div class="menu-heading-top">
        <div>
          <strong>Palmyra Pizzeria</strong>
          <span>Beställning · meny, kundvagn och tracking</span>
        </div>
        <a class="menu-home-link" href="index.html" aria-label="Tillbaka till Palmyra Pizzeria">← Hem</a>
      </div>
    </header>
    <main data-viaeats-menu="palmyra-pizzeria-lund" data-viaeats-fullscreen="1"></main>
  </div>
  <script src="embed.js?v=4" defer></script>
</body>
</html>
